name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the snapshot refresh workflow run CI on the PR it opens: pull requests opened
  # with GITHUB_TOKEN don't trigger pull_request runs.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK with licenses accepted; AGP fetches
      # any missing platform itself.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:sharedLogic:testAndroidHostTest :app:androidApp:testDebugUnitTest

      # Errors fail the build; warnings only show up in the report.
      - name: Lint
        run: ./gradlew :app:androidApp:lintDebug

      - name: Debug APK
        run: ./gradlew :app:androidApp:assembleDebug

      # Unsigned unless signing secrets are configured; this catches R8 and resource-shrink breakage.
      - name: Release build (R8)
        run: ./gradlew :app:androidApp:assembleRelease

      - name: Test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/*/build/reports/tests/
            app/androidApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: tune-roam-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
