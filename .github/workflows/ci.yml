name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK with licenses accepted; AGP fetches
      # any missing platform itself.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:sharedLogic:testDebugUnitTest :app:androidApp:testDebugUnitTest

      - name: Debug APK
        run: ./gradlew :app:androidApp:assembleDebug

      # Unsigned unless signing secrets are configured; this catches R8 and resource-shrink breakage.
      - name: Release build (R8)
        run: ./gradlew :app:androidApp:assembleRelease

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/*/build/reports/tests/
          if-no-files-found: ignore

      - name: Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tune-roam-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
