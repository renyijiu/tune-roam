name: Release

# Pushing a tag like v0.1.0 builds a signed release APK and publishes it as a GitHub
# Release for manual download. The tag must match versionName and AppIdentity.VERSION.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gradle_version=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/androidApp/build.gradle.kts)
          identity_version=$(sed -nE 's/^ *const val VERSION = "([^"]+)".*/\1/p' \
            app/sharedLogic/src/commonMain/kotlin/app/tuneroam/radio/core/AppIdentity.kt)
          if [ "$tag" != "$gradle_version" ] || [ "$tag" != "$identity_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName ($gradle_version) and AppIdentity.VERSION ($identity_version)."
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:sharedLogic:testDebugUnitTest :app:androidApp:testDebugUnitTest

      # An unsigned APK cannot be installed, so a release without signing secrets fails here.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TUNEROAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret TUNEROAM_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Release APK
        env:
          TUNEROAM_KEYSTORE: ${{ runner.temp }}/release.jks
          TUNEROAM_KEYSTORE_PASSWORD: ${{ secrets.TUNEROAM_KEYSTORE_PASSWORD }}
          TUNEROAM_KEY_ALIAS: ${{ secrets.TUNEROAM_KEY_ALIAS }}
          TUNEROAM_KEY_PASSWORD: ${{ secrets.TUNEROAM_KEY_PASSWORD }}
        run: ./gradlew :app:androidApp:assembleRelease

      # AGP names the output androidApp-release-unsigned.apk when signing did not apply.
      - name: Collect APK
        run: |
          src=app/androidApp/build/outputs/apk/release/androidApp-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::No signed APK; check the TUNEROAM_* signing secrets."
            exit 1
          fi
          mkdir -p dist
          name="tune-roam-${{ steps.version.outputs.name }}.apk"
          cp "$src" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ steps.version.outputs.name }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
