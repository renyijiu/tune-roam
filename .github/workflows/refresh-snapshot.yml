name: Refresh bundled snapshot

# Monthly, or by hand from the Actions tab. Regenerates the offline station snapshot
# and opens a pull request when it changed; nothing lands without review.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate snapshot
        run: python3 scripts/refresh_bundled_snapshot.py

      # Opening a PR from a workflow needs "Allow GitHub Actions to create and approve
      # pull requests" under Settings → Actions → General.
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/refresh-bundled-snapshot
          delete-branch: true
          commit-message: Refresh the bundled station snapshot.
          title: Refresh the bundled station snapshot
          body: |
            Regenerated by `scripts/refresh_bundled_snapshot.py` from Radio Browser.
            CI runs the unit tests (including the snapshot checks) on this PR.
