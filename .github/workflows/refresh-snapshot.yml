name: Refresh bundled snapshot

# Monthly, or by hand from the Actions tab. Regenerates the offline station snapshot
# and opens a pull request when it changed; nothing lands without review.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate snapshot
        run: python3 scripts/refresh_bundled_snapshot.py

      # Opening a PR from a workflow needs "Allow GitHub Actions to create and approve
      # pull requests" under Settings → Actions → General.
      - id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/refresh-bundled-snapshot
          delete-branch: true
          commit-message: Refresh the bundled station snapshot.
          title: Refresh the bundled station snapshot
          body: |
            Regenerated by `scripts/refresh_bundled_snapshot.py` from Radio Browser.
            CI runs the unit tests (including the snapshot checks) on this PR.

      # A PR opened with GITHUB_TOKEN doesn't trigger pull_request workflows, so start CI
      # on the branch by hand; the run's check shows up on the PR's head commit.
      - name: Run CI on the pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/refresh-bundled-snapshot
