name: 问题反馈 / Bug report
description: 崩溃、功能不正常，或某个台放不了
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 怎么操作的，期望看到什么，实际看到什么。
    validations:
      required: true
  - type: input
    id: station
    attributes:
      label: 电台 / Station
      description: 跟某个台有关时，填台名和 stationuuid（分享链接里就有）。
      placeholder: "例如 CNR 中国之声，tuneroam://station/…"
  - type: input
    id: region
    attributes:
      label: 所在地区和网络 / Region and network
      description: 很多台只在某些地区连不上。
      placeholder: "例如 中国大陆，移动网络"
  - type: input
    id: version
    attributes:
      label: 版本 / App version
      description: 设置页底部。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机和系统 / Device and Android version
      placeholder: "例如 Pixel 8，Android 15"
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: 崩溃日志 / Crash log
      description: 设置页「崩溃日志」里可以分享。
      render: text
